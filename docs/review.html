<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rad Libs Story Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e42;
      --accent: #7c3aed;
      --accent-light: #a855f7;
      --text: #e8e8f0;
      --text-muted: #9090aa;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Auth overlay ── */
    #auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .auth-card h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .auth-card p  { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 28px; }

    .auth-card input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-card input[type="password"]:focus { border-color: var(--accent-light); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; justify-content: center; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent-light); }

    #auth-error {
      margin-top: 14px;
      color: var(--danger);
      font-size: 0.88rem;
      min-height: 20px;
    }

    #lockout-timer {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ── App shell ── */
    #app-screen { display: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .topbar h1 { font-size: 1.1rem; flex: 1; white-space: nowrap; }

    .topbar select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      max-width: 260px;
      flex: 1;
      outline: none;
    }

    #story-count {
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .main {
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── Loading / empty ── */
    #loading-msg, #empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 0;
      font-size: 1rem;
    }

    /* ── Story cards ── */
    .story-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .story-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .story-title { font-size: 1.05rem; font-weight: 600; }
    .story-id    { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    /* ── Rendered story ── */
    .story-rendered {
      line-height: 1.9;
      font-size: 0.97rem;
      margin-bottom: 20px;
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .blank-token {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border-radius: 5px;
      padding: 1px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      margin: 0 2px;
      vertical-align: middle;
      white-space: nowrap;
    }

    /* ── Edit section ── */
    .edit-section { margin-top: 4px; }

    .edit-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: var(--radius);
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      margin-bottom: 12px;
    }

    .edit-toggle:hover { border-color: var(--accent-light); color: var(--text); }

    .edit-area { display: none; }
    .edit-area.open { display: block; }

    .edit-area textarea {
      width: 100%;
      min-height: 140px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      line-height: 1.7;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 10px;
    }

    .edit-area textarea:focus { border-color: var(--accent-light); }

    .edit-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .suggest-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 9px 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      text-decoration: none;
      display: inline-block;
    }

    .suggest-btn:hover { opacity: 0.85; }

    .blank-count {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: #1e3a2f;
      border: 1px solid #22c55e44;
      color: var(--success);
      white-space: nowrap;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>Story Review</h1>
    <p>Sagacious Apps internal tool</p>
    <input type="password" id="pass-input" placeholder="Passphrase" autocomplete="current-password">
    <button class="btn btn-primary" id="unlock-btn" onclick="tryUnlock()">Unlock</button>
    <div id="auth-error"></div>
    <div id="lockout-timer"></div>
  </div>
</div>

<!-- App Screen -->
<div id="app-screen">
  <div class="topbar">
    <h1>📖 Story Review</h1>
    <select id="db-select" onchange="switchDatabase()">
      <option value="prod">🟢 Production DB</option>
      <option value="dev">🔧 Dev DB</option>
    </select>
    <select id="collection-select" onchange="filterStories()">
      <option value="">All Collections</option>
    </select>
    <span id="story-count"></span>
    <button class="btn btn-secondary" onclick="logout()" style="padding:8px 14px;font-size:0.82rem;">Log out</button>
  </div>
  <div class="main">
    <div id="loading-msg">Loading stories from Firebase…</div>
    <div id="empty-msg" style="display:none;">No stories found.</div>
    <div id="story-list"></div>
  </div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const DB_URLS = {
    prod: 'https://radlibsapp-default-rtdb.firebaseio.com',
    dev:  'https://radlibsapp-dev.firebaseio.com'
  };
  let DB_URL = DB_URLS.prod;
  const PASS_HASH     = '852e7ab220b8ef8b902bb2a6bbc8c8ba611ef55e8ea42d7f6f82c3e2f87fe6fa';
  const SUPPORT_EMAIL = 'support@sagacious-apps.com';
  const SESSION_KEY   = 'rl_review_auth';
  const LOCKOUT_KEY   = 'rl_review_lockout';
  const MAX_ATTEMPTS  = 5;
  const BASE_DELAY_MS = 30000; // 30 s base, doubles each round

  // ── Brute-force state ───────────────────────────────────────────────────────
  function getLockout() {
    try { return JSON.parse(localStorage.getItem(LOCKOUT_KEY)) || { attempts: 0, until: 0 }; }
    catch { return { attempts: 0, until: 0 }; }
  }

  function saveLockout(state) {
    localStorage.setItem(LOCKOUT_KEY, JSON.stringify(state));
  }

  function isLockedOut() {
    const s = getLockout();
    return s.until > Date.now();
  }

  function remainingSeconds() {
    return Math.ceil((getLockout().until - Date.now()) / 1000);
  }

  let countdownTimer = null;

  function startCountdown() {
    clearInterval(countdownTimer);
    const el = document.getElementById('lockout-timer');
    const btn = document.getElementById('unlock-btn');

    function tick() {
      const rem = remainingSeconds();
      if (rem <= 0) {
        clearInterval(countdownTimer);
        el.textContent = '';
        btn.disabled = false;
        document.getElementById('auth-error').textContent = '';
      } else {
        const m = Math.floor(rem / 60), s = rem % 60;
        el.textContent = `Try again in ${m}:${String(s).padStart(2,'0')}`;
        btn.disabled = true;
      }
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  // ── SHA-256 via Web Crypto ───────────────────────────────────────────────────
  async function sha256(str) {
    const buf  = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // ── Auth ────────────────────────────────────────────────────────────────────
  async function tryUnlock() {
    if (isLockedOut()) { startCountdown(); return; }

    const passInput = document.getElementById('pass-input');
    const errEl     = document.getElementById('auth-error');
    const btn       = document.getElementById('unlock-btn');

    btn.disabled = true;
    btn.textContent = 'Checking…';

    const hash = await sha256(passInput.value.trim());

    if (hash === PASS_HASH) {
      // Success
      saveLockout({ attempts: 0, until: 0 });
      sessionStorage.setItem(SESSION_KEY, '1');
      showApp();
    } else {
      // Failure
      const state = getLockout();
      state.attempts += 1;

      if (state.attempts >= MAX_ATTEMPTS) {
        const round   = Math.floor(state.attempts / MAX_ATTEMPTS);
        state.until   = Date.now() + BASE_DELAY_MS * Math.pow(2, round - 1);
        errEl.textContent = 'Too many failed attempts.';
        startCountdown();
      } else {
        const left = MAX_ATTEMPTS - state.attempts;
        errEl.textContent = `Incorrect passphrase. ${left} attempt${left === 1 ? '' : 's'} remaining.`;
        btn.disabled = false;
        btn.textContent = 'Unlock';
      }

      saveLockout(state);
      passInput.value = '';
    }
  }

  function logout() {
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }

  // allow Enter key
  document.getElementById('pass-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock();
  });

  // ── Startup ─────────────────────────────────────────────────────────────────
  if (isLockedOut()) {
    document.getElementById('auth-error').textContent = 'Too many failed attempts.';
    startCountdown();
  }

  if (sessionStorage.getItem(SESSION_KEY)) {
    showApp();
  }

  // ── App ──────────────────────────────────────────────────────────────────────
  let allStories = [];

  function showApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display  = 'block';
    loadStories();
  }

  function switchDatabase() {
    const sel = document.getElementById('db-select').value;
    DB_URL = DB_URLS[sel];
    document.getElementById('loading-msg').style.display = 'block';
    document.getElementById('loading-msg').textContent = 'Loading stories from Firebase…';
    document.getElementById('story-list').innerHTML = '';
    allStories = [];
    loadStories();
  }

  async function loadStories() {
    try {
      const res  = await fetch(`${DB_URL}/radlibs.json`);
      const data = await res.json();

      if (!data) {
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('empty-msg').style.display   = 'block';
        return;
      }

      allStories = [];
      const select = document.getElementById('collection-select');

      // Clear existing options except "All"
      while (select.options.length > 1) select.remove(1);

      for (const [category, collection] of Object.entries(data)) {
        // Add to dropdown
        const opt   = document.createElement('option');
        opt.value   = category;
        opt.textContent = category;
        select.appendChild(opt);

        // Collect stories
        const stories = collection.stories;
        if (!stories) continue;

        const list = Array.isArray(stories) ? stories : Object.values(stories);
        for (const story of list) {
          allStories.push({ ...story, _category: category });
        }
      }

      document.getElementById('loading-msg').style.display = 'none';
      filterStories();
    } catch (err) {
      document.getElementById('loading-msg').textContent = `Error loading stories: ${err.message}`;
    }
  }

  function filterStories() {
    const cat     = document.getElementById('collection-select').value;
    const visible = cat ? allStories.filter(s => s._category === cat) : allStories;

    document.getElementById('story-count').textContent = `${visible.length} stor${visible.length === 1 ? 'y' : 'ies'}`;
    renderStories(visible);
  }

  function renderStories(stories) {
    const container = document.getElementById('story-list');
    container.innerHTML = '';

    if (!stories.length) {
      document.getElementById('empty-msg').style.display = 'block';
      return;
    }

    document.getElementById('empty-msg').style.display = 'none';

    for (const story of stories) {
      container.appendChild(buildCard(story));
    }
  }

  // ── Story card ───────────────────────────────────────────────────────────────
  function buildCard(story) {
    const card = document.createElement('div');
    card.className = 'story-card';

    // Header
    const header = document.createElement('div');
    header.className = 'story-header';

    const titleBlock = document.createElement('div');
    const titleEl    = document.createElement('div');
    titleEl.className = 'story-title';
    titleEl.textContent = story.Title || story.title || '(untitled)';
    const idEl = document.createElement('div');
    idEl.className = 'id';
    idEl.style.cssText = 'font-size:0.72rem;color:var(--text-muted);margin-top:3px;';
    idEl.textContent = `${story._category} · ${story.Id || story.id || ''}`;
    titleBlock.appendChild(titleEl);
    titleBlock.appendChild(idEl);

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = story._category;

    const storyText  = story.Story || story.story || '';
    const blankCount = (storyText.match(/\{[^{}]+\}/g) || []).length;
    const blankBadge = document.createElement('span');
    blankBadge.className = 'blank-count';
    blankBadge.title = 'Number of blanks in this story';
    blankBadge.textContent = `${blankCount} blank${blankCount === 1 ? '' : 's'}`;

    const badges = document.createElement('div');
    badges.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;';
    badges.appendChild(blankBadge);
    badges.appendChild(badge);

    header.appendChild(titleBlock);
    header.appendChild(badges);
    card.appendChild(header);

    // Rendered story with blank badges
    const rendered = document.createElement('div');
    rendered.className = 'story-rendered';
    rendered.innerHTML = renderStoryText(story.Story || story.story || '');
    card.appendChild(rendered);

    // Edit section
    card.appendChild(buildEditSection(story));

    return card;
  }

  function renderStoryText(text) {
    return text.replace(/\{([^{}]+)\}/g, (_, token) =>
      `<span class="blank-token">${token}</span>`
    );
  }

  function buildEditSection(story) {
    const section = document.createElement('div');
    section.className = 'edit-section';

    const toggle = document.createElement('button');
    toggle.className = 'edit-toggle';
    toggle.textContent = '✏️  Suggest an edit';

    const area = document.createElement('div');
    area.className = 'edit-area';

    const hint = document.createElement('p');
    hint.className = 'edit-hint';
    hint.textContent = 'Edit the story text below. Blanks must stay in {curly-brace} format.';

    const ta = document.createElement('textarea');
    ta.value = story.Story || story.story || '';
    ta.spellcheck = true;

    const sendBtn = document.createElement('a');
    sendBtn.className = 'suggest-btn';
    sendBtn.textContent = '📧  Send suggestion';

    sendBtn.addEventListener('click', () => {
      const subject = encodeURIComponent(`Story edit suggestion: ${story.Title || story.id}`);
      const body    = encodeURIComponent(
        `Collection: ${story._category}\n` +
        `Story ID: ${story.Id || story.id}\n` +
        `Title: ${story.Title || story.title}\n\n` +
        `--- Suggested story text ---\n${ta.value}`
      );
      sendBtn.href = `mailto:${SUPPORT_EMAIL}?subject=${subject}&body=${body}`;
    });

    area.appendChild(hint);
    area.appendChild(ta);
    area.appendChild(sendBtn);

    toggle.addEventListener('click', () => {
      const open = area.classList.toggle('open');
      toggle.textContent = open ? '✏️  Hide editor' : '✏️  Suggest an edit';
    });

    section.appendChild(toggle);
    section.appendChild(area);
    return section;
  }
</script>
</body>
</html>
